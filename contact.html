<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — Zerone</title>
    <meta name="description" content="Book a 30-minute call with Zerone to talk through your professional brand, new clinic or existing clinic." />
    <link rel="canonical" href="https://zerone.vn/contact.html" />
    <link rel="alternate" hreflang="en" href="https://zerone.vn/contact.html" />
    <link rel="alternate" hreflang="vi" href="https://zerone.vn/vi/contact.html" />
    <link rel="alternate" hreflang="x-default" href="https://zerone.vn/contact.html" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/site.css?v=20261014d" />
  </head>
  <body data-page="Contact">
    <div id="chrome-top"></div>
    <main class="contact-page">
      <section class="contact-intro">
        <p class="kicker">Contact</p>
        <h1 class="display">Book a 30-minute call.</h1>
        <p class="lede">Tell us what you are trying to build. We listen first, share an honest view, and agree the next step together.</p>
      </section>

      <section class="contact-block">
        <h2 class="contact-h">Choose how to reach us</h2>
        <div class="contact-cards" id="contact-cards"></div>
        <p class="contact-loc">Ho Chi Minh City, Vietnam</p>
      </section>
    </main>
    <div id="chrome-bottom"></div>
    <script src="js/site.js?v=20261014d"></script>
    <script>
      /* ---- EDIT HERE: fill in the details you want to show. Leave "" to hide a method. ---- */
      var CONTACT = {
        booking: "https://docs.google.com/forms/d/e/1FAIpQLSdCS5G2tBktQliHjaVjCL8U8EAnvrs0LmhNkPiKgd8-xR3dHA/viewform",
        email: "nguyentranlinhthao@zerone.vn",
        phone: "",     /* e.g. +84 9xx xxx xxx */
        zalo: "",      /* Zalo link or number, e.g. https://zalo.me/09xxxxxxxx */
        whatsapp: ""   /* e.g. https://wa.me/849xxxxxxxx */
      };
      (function () {
        var box = document.getElementById("contact-cards"), items = [];
        if (CONTACT.booking) items.push(["Book a call", "Book a 30-minute call", CONTACT.booking, "Leave your details"]);
        if (CONTACT.email) items.push(["Email", CONTACT.email, "mailto:" + CONTACT.email, "Send an email"]);
        if (CONTACT.phone) items.push(["Phone", CONTACT.phone, "tel:" + CONTACT.phone.replace(/[^+\d]/g, ""), "Call us"]);
        if (CONTACT.zalo) items.push(["Zalo", "Message us on Zalo", CONTACT.zalo.indexOf("http") === 0 ? CONTACT.zalo : "https://zalo.me/" + CONTACT.zalo.replace(/\D/g, ""), "Open Zalo"]);
        if (CONTACT.whatsapp) items.push(["WhatsApp", "Message us on WhatsApp", CONTACT.whatsapp, "Open WhatsApp"]);
        box.innerHTML = items.map(function (i) {
          return '<a class="contact-card" href="' + i[2] + '"' + (i[2].indexOf("http") === 0 ? ' target="_blank" rel="noopener"' : '') + '><span class="contact-card-label">' + i[0] + '</span><strong>' + i[1] + '</strong><span class="contact-card-cta">' + i[3] + ' →</span></a>';
        }).join("");
        if (!items.length) box.parentNode.hidden = true;
      })();
    </script>
  </body>
</html>
